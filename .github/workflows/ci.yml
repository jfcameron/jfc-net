name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest
            tests: true

          - preset: linux-clang
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc
            runner: ubuntu-24.04-arm
            tests: true

          - preset: macos-clang
            runner: macos-latest
            tests: true

          - preset: windows-msvc
            runner: windows-latest
            tests: true

          - preset: linux-clang-asan
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc-ci
            runner: ubuntu-latest
            tests: true

          - preset: linux-clang-ci
            runner: ubuntu-latest
            tests: true


    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test
        if: matrix.tests
        run: ctest --preset ${{ matrix.preset }}

  android:
    name: android ${{ matrix.preset }} (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [android-arm64, android-armv7, android-x86_64, android-x86]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

  android-emulator:
    name: android x86_64 (tests on an emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: let the emulator use kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-x86_64

      - name: build
        run: cmake --build --preset android-x86_64

      - name: test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ctest --test-dir out/build/android-x86_64 --output-on-failure

  ios:
    name: ios arm64 (compile only)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: brew install ninja

      - name: configure
        run: cmake --preset ios

      - name: build
        run: cmake --build --preset ios

  ios-simulator:
    name: ios simulator arm64 (tests)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: brew install ninja

      - name: configure
        run: cmake --preset ios-simulator

      - name: build
        run: cmake --build --preset ios-simulator

      - name: boot a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c 'import json, sys; print(next(d["udid"] for runtime, devices in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: test
        run: ctest --test-dir out/build/ios-simulator --output-on-failure

  emscripten:
    name: emscripten (wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: report the toolchain
        run: emcc --version

      - name: install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium firefox

      - name: configure
        run: emcmake cmake --preset emscripten-test -DJFC_NET_TEST_REAL_BROWSERS=ON

      - name: build
        run: cmake --build --preset emscripten-test

      - name: test
        run: ctest --preset emscripten-test

  docs:
    name: doxygen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install doxygen and graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: generate
        run: cmake --preset linux-docs

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/linux-docs/docs

  pages:
    name: publish to github pages
    needs: docs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
